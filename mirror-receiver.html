<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nest Hub 分頁觸控</title>
  <style>
    :root { font: 20px/1.4 system-ui, sans-serif; color: #edf5ff; background: #0b1322; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; position: relative; overflow: hidden; }
    header {
      position: absolute; z-index: 1; inset: 0 0 auto; display: flex; justify-content: space-between;
      gap: 12px; padding: 10px 18px; background: #152440; pointer-events: none;
    }
    header[hidden] { display: none; }
    #status { color: #b8cbea; font-size: .85em; }
    #stage { position: absolute; inset: 0; overflow: hidden; touch-action: manipulation; }
    #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    touch-controls { pointer-events: none !important; }
  </style>
</head>
<body>
  <header><strong>分頁觸控測試</strong><span id="status">等待 Windows 分享畫面</span></header>
  <main id="stage" aria-label="Chrome 測試分頁"></main>
  <script>
  (() => {
    'use strict';
    const CHANNEL = 'urn:x-cast:com.example.nesthub.desktopmirror';
    const MAX_IMAGE_LENGTH = 36_000;
    const stage = document.querySelector('#stage');
    const header = document.querySelector('header');
    const status = document.querySelector('#status');
    let owner = null;
    let visibleFrame = null;
    let pendingImage = null;
    let expiry;
    let sendTap;

    function clearFrame() {
      clearTimeout(expiry);
      pendingImage = visibleFrame = owner = null;
      stage.replaceChildren();
      header.hidden = false;
      status.textContent = '等待 Windows 分享畫面';
    }

    function acceptMessage(sender, data) {
      if (typeof sender !== 'string' || !sender || !data || (owner && owner !== sender)) return;
      if (data.kind === 'stop') return clearFrame();
      if (data.kind !== 'frame' || !Number.isSafeInteger(data.id) ||
          typeof data.stream !== 'string' || typeof data.image !== 'string' ||
          data.image.length > MAX_IMAGE_LENGTH ||
          !/^data:image\/jpeg;base64,[a-zA-Z0-9+/]+={0,2}$/.test(data.image)) return;
      owner = sender;
      clearTimeout(expiry);
      expiry = setTimeout(clearFrame, 4_500);
      const image = new Image();
      image.alt = 'Chrome 測試分頁畫面';
      pendingImage = image;
      image.onload = () => {
        if (pendingImage !== image) return;
        visibleFrame = { id: data.id, stream: data.stream, image };
        stage.replaceChildren(image);
        header.hidden = true;
      };
      image.src = data.image;
    }

    stage.addEventListener('click', event => {
      if (!event.isTrusted || !visibleFrame || !sendTap) return;
      const { id, stream, image } = visibleFrame;
      const rect = stage.getBoundingClientRect();
      const scale = Math.min(rect.width / image.naturalWidth, rect.height / image.naturalHeight);
      const width = image.naturalWidth * scale;
      const height = image.naturalHeight * scale;
      const x = (event.clientX - rect.left - (rect.width - width) / 2) / width;
      const y = (event.clientY - rect.top - (rect.height - height) / 2) / height;
      if (x >= 0 && x < 1 && y >= 0 && y < 1) {
        try { sendTap(owner, { kind: 'tap', id, stream, x, y }); }
        catch (error) { console.warn('Touch returned to a closed session:', error); }
      }
    });

    const key = new URLSearchParams(location.search).get('preview');
    if (key && /^[\da-f-]{36}$/i.test(key) && location.hostname === '127.0.0.1') {
      const preview = new BroadcastChannel(`desk-preview-${key}`);
      preview.onmessage = ({ data }) => acceptMessage('preview', data);
      sendTap = (_, data) => preview.postMessage(data);
      preview.postMessage({ kind: 'preview-ready' });
      return;
    }

    function makeOverlayTransparent() {
      for (const overlay of document.querySelectorAll('touch-controls')) {
        overlay.style.setProperty('pointer-events', 'none', 'important');
      }
    }

    // Keep the tested non-media CAF overlay workaround even when CAF inserts it late.
    new MutationObserver(makeOverlayTransparent).observe(document.body, { childList: true, subtree: true });
    const sdk = document.createElement('script');
    sdk.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
    sdk.onerror = () => { status.textContent = 'Cast Receiver SDK 載入失敗'; };
    sdk.onload = () => {
      if (!window.cast?.framework) {
        status.textContent = 'Cast Receiver SDK 載入失敗';
        return;
      }
      try {
        const framework = cast.framework;
        const context = framework.CastReceiverContext.getInstance();
        const events = framework.system.EventType;
        sendTap = (sender, data) => context.sendCustomMessage(CHANNEL, sender, data);
        context.addCustomMessageListener(CHANNEL, event => acceptMessage(event.senderId, event.data));
        context.addEventListener(events.READY, makeOverlayTransparent);
        context.addEventListener(events.SENDER_DISCONNECTED, event => {
          if (event.senderId === owner) clearFrame();
        });
        context.start({
          skipPlayersLoad: true,
          disableIdleTimeout: true,
          uiConfig: { touchScreenOptimizedApp: true },
          customNamespaces: { [CHANNEL]: framework.system.MessageType.JSON }
        });
      } catch (error) {
        status.textContent = 'Cast Receiver 啟動失敗';
        console.error(error);
      }
    };
    document.head.appendChild(sdk);
  })();
  </script>
</body>
</html>
